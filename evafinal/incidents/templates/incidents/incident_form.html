{% extends 'base.html' %}

{% block content %}
<h2>{{ action }} Registro de Accidente</h2>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-3">
        <button type="submit" class="btn btn-success">Guardar Registro</button>
        <a href="{% url 'incident_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
