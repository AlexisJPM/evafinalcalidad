{% extends 'base.html' %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h3>Confirmar Eliminación</h3>
    </div>
    <div class="card-body">
        <p>¿Está seguro de que desea eliminar el registro del accidente correspondiente a <strong>{{ incident.employee_name }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
            <a href="{% url 'incident_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
